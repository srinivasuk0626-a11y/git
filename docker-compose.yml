services:
  api:
    build: .
    environment:
      DATA_DIR: /app/data
      AUDIT_LOG_PATH: /app/var/audit.jsonl
      TICKET_DB_PATH: /app/var/tickets.db
      RETRIEVAL_BACKEND: ${RETRIEVAL_BACKEND:-memory}
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "8000:8000"
    volumes:
      - resolveai-var:/app/var

  elasticsearch:
    profiles: ["elastic"]
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data

volumes:
  resolveai-var:
  elastic-data:
